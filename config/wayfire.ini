# noodle-desktop wayfire configuration
#
# Loaded by the wrapped wayfire through WAYFIRE_CONFIG_FILE.

[core]
plugins = \
  autostart \
  command \
  expo \
  grid \
  move \
  place \
  resize \
  session-lock \
  switcher \
  vswitch \
  window-rules \
  wm-actions

close_top_view = <alt> KEY_Q

preferred_decoration_mode = client

[move]
activate = <alt> BTN_LEFT

[resize]
activate = <alt> BTN_RIGHT

[grid]
slot_bl = <alt> KEY_KP1
slot_b = <alt> KEY_KP2
slot_br = <alt> KEY_KP3
slot_l = <alt> KEY_LEFT
slot_c = <alt> KEY_UP
slot_r = <alt> KEY_RIGHT
slot_tl = <alt> KEY_KP7
slot_t = <alt> KEY_KP8
slot_tr = <alt> KEY_KP9
restore = <alt> KEY_DOWN

[vswitch]
binding_left = <ctrl> <alt> KEY_LEFT
binding_down = <ctrl> <alt> KEY_DOWN
binding_up = <ctrl> <alt> KEY_UP
binding_right = <ctrl> <alt> KEY_RIGHT

[command]
binding_terminal = <alt> KEY_ENTER
command_terminal = alacritty

[autostart]
# Do not start the wf-shell panel; noodle-shell owns the top bar.
autostart_wf_shell = false

# Resolves through the PATH set by the noodle-desktop wrapper.
noodle_shell = noodle-shell
